# Secrets DETECTION (Gitleaks, gate 1) answers "did a secret leak?". This
# answers the question that follows: "then where should the secret live?".
# Never in a manifest — even base64 in a Secret is encoding, not encryption.
# The GitOps-friendly pattern is an external store (AWS SSM / Secrets Manager,
# Vault) synced at runtime by the External Secrets Operator, so Git holds only
# a reference, never the value. Sealed Secrets is the alternative when you want
# the encrypted value in Git.
#
# Reference manifest — requires the External Secrets Operator installed and a
# SecretStore configured; not exercised in the local POC (declared in TESTES.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payments-demo-db
  namespace: demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: SecretStore
  target:
    name: payments-demo-db      # the k8s Secret ESO creates/refreshes
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: /payments-demo/prod/database-url
