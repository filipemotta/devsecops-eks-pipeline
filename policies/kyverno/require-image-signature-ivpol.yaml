# Modern variant of require-image-signature.yaml using Kyverno's CEL-based
# ImageValidatingPolicy (policies.kyverno.io/v1). As of Kyverno 1.19 the classic
# ClusterPolicy kind is deprecated in favor of these types — both work today;
# new clusters should start here. Replace OWNER/REPO with yours.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: require-image-signature
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE", "UPDATE"]
  matchImageReferences:
    - glob: "ghcr.io/OWNER/payments-demo*"
  attestors:
    - name: pipeline
      cosign:
        keyless:
          identities:
            - subject: "https://github.com/OWNER/REPO/.github/workflows/*"
              issuer: "https://token.actions.githubusercontent.com"
        ctlog:
          url: "https://rekor.sigstore.dev"
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.pipeline])).all(e, e > 0)
      message: "Image is not signed by the CI pipeline (Cosign keyless)."
