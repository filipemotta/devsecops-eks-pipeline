# Gate: ":latest" (or a missing tag) breaks chain traceability — the image
# Trivy scanned and Cosign signed is no longer identifiable. Explicit tags
# always; digests in production. The two-rule structure mirrors the official
# kyverno/policies best-practices/disallow_latest_tag policy.
# NOTE (verified on Kyverno 1.19, 2026-08-23): the ClusterPolicy kind is
# deprecated in favor of the CEL-based policy types (policies.kyverno.io).
# It still works and remains the most widely deployed form; see
# require-image-signature-ivpol.yaml for the modern equivalent pattern.
# SIDE DOOR: these rules match spec.containers only. An ephemeral (kubectl
# debug) container lands in spec.ephemeralContainers and slips past — verified
# on a live cluster. restrict-ephemeral-containers.yaml closes that door.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - falco
      validate:
        failureAction: Enforce
        message: "An explicit image tag is required."
        pattern:
          spec:
            containers:
              - image: "*:*"
    - name: validate-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - falco
      validate:
        failureAction: Enforce
        message: "The ':latest' tag is not allowed."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
