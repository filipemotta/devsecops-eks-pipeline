# Gate: an image without OUR pipeline's Cosign signature does not enter the
# cluster. The keyless identity below matches the build job in
# ci/devsecops-pipeline.yaml. Replace OWNER/REPO with yours.
# NOTE (verified on Kyverno 1.19, 2026-08-23): the ClusterPolicy kind is
# deprecated in favor of the CEL-based policy types (policies.kyverno.io).
# It still works and remains the most widely deployed form; see
# require-image-signature-ivpol.yaml for the modern equivalent pattern.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-image-signature
spec:
  webhookConfiguration:
    timeoutSeconds: 30
  rules:
    - name: require-cosign-keyless
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - demo
      verifyImages:
        - imageReferences:
            - "ghcr.io/OWNER/payments-demo*"
          failureAction: Enforce
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/OWNER/REPO/.github/workflows/*"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
