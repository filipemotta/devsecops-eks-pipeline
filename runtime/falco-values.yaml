# Helm values for the falcosecurity/falco chart (installs Falco + Falcosidekick).
#   helm repo add falcosecurity https://falcosecurity.github.io/charts
#   helm install falco falcosecurity/falco -n falco --create-namespace -f falco-values.yaml
# Fields verified against the official docs (falco.org) on 2026-08-23.

# Modern eBPF driver (CO-RE): no kernel module compilation on the node.
# This is the ONLY eBPF option in current charts (legacy driver.kind=ebpf was
# removed — see the chart's BREAKING-CHANGES.md). Needs a kernel with BTF:
# native on EKS AL2023; does NOT run on Docker Desktop's macOS VM kernel
# (tested 2026-08-23: BPF_TRACE_RAW_TP unsupported) — use a Linux host or EKS.
driver:
  kind: modern_ebpf

tty: true

# Falcosidekick: an alert must reach someone, not a log file.
falcosidekick:
  enabled: true
  webui:
    enabled: true
  config:
    slack:
      # Placeholder on purpose — the real webhook comes from a Secret/CI, never from Git.
      # (A hardcoded webhook here is exactly what the secrets stage of the pipeline blocks.)
      webhookurl: "https://hooks.slack.com/services/CHANGE/ME/PLACEHOLDER"
      channel: "#security-alerts"
      username: "falco"
      minimumpriority: "error"

# Custom rules land in a configmap under /etc/falco/rules.d (loaded after defaults).
customRules:
  custom-rules.yaml: |-
    - rule: Shell spawned in demo workload
      desc: >
        Interactive shell inside a container of the demo namespace. Legitimate
        exec sessions are rare and audited; anything else is investigation-worthy.
      condition: >
        spawned_process and container
        and proc.name in (bash, sh, zsh)
        and k8s.ns.name = "demo"
      output: >
        Shell in demo container (command=%proc.cmdline user=%user.name
        container=%container.name image=%container.image.repository ns=%k8s.ns.name)
      priority: ERROR
      tags: [container, shell, demo]

    - rule: Package manager in running container
      desc: >
        apt/apk/pip executing inside a running container: images are immutable,
        so runtime installs signal drift or compromise.
      condition: >
        spawned_process and container
        and proc.name in (apt, apt-get, apk, pip, pip3)
        and k8s.ns.name = "demo"
      output: >
        Package manager in running container (command=%proc.cmdline
        container=%container.name image=%container.image.repository ns=%k8s.ns.name)
      priority: ERROR
      tags: [container, drift, demo]
